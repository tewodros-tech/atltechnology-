<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATL Technology | SACCO Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', 'Space Grotesk', sans-serif; background: #050A12; color: #E8F0F8; overflow-x: hidden; }
    #networkCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; background: radial-gradient(circle at 30% 20%, #0A1020, #020408); }
    .container { max-width: 1280px; margin: 0 auto; padding: 0 32px; position: relative; z-index: 2; }
    .nav { position: fixed; top: 0; width: 100%; z-index: 1000; background: rgba(5, 10, 20, 0.92); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(0, 212, 255, 0.35); }
    .nav-inner { display: flex; justify-content: space-between; align-items: center; height: 80px; max-width: 1280px; margin: 0 auto; padding: 0 32px; }
    .logo { font-size: 1.7rem; font-weight: 800; background: linear-gradient(135deg, #FFFFFF, #00D4FF); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .links { display: flex; gap: 32px; }
    .links a { color: #C8E0F0; text-decoration: none; font-weight: 500; transition: 0.3s; }
    .links a:hover, .links a.active { color: #00D4FF; }
    .menu-toggle { display: none; font-size: 1.6rem; cursor: pointer; color: #00D4FF; }
    .page-hero { text-align: center; padding: 140px 0 60px; }
    .page-hero h1 { font-size: 3rem; background: linear-gradient(125deg, #FFFFFF, #7AE6FF); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .section-title { font-size: 2.5rem; text-align: center; margin-bottom: 20px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 32px; margin-top: 40px; }
